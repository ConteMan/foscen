<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Foscen 图标 16px 实测</title>
    <style>
      body {
        margin: 24px;
        font-family: Inter, ui-sans-serif, sans-serif;
        color: #e8fff2;
        background: #0b2018;
      }
      h1 {
        font-size: 16px;
      }
      p {
        color: #9bb5a8;
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 32px;
        margin: 24px 0;
        align-items: end;
      }
      figure {
        margin: 0;
        text-align: center;
      }
      figcaption {
        margin-top: 8px;
        color: #9bb5a8;
        font-size: 11px;
      }
      .slot {
        display: grid;
        place-items: center;
        background: #123426;
        border: 1px solid rgb(114 219 165 / 25%);
      }
      img.icon {
        display: block;
        width: 16px;
        height: 16px;
      }
      .zoom {
        image-rendering: pixelated;
        width: 128px;
        height: 128px;
      }
      .on-light {
        background: #f3f1eb;
      }
      .pair {
        display: flex;
        gap: 16px;
        align-items: end;
      }
      .slot.big {
        width: 128px;
        height: 128px;
        overflow: hidden;
        place-items: start;
      }
    </style>
  </head>
  <body>
    <h1>正式图标按真实 CSS 像素绘制（不是推断）</h1>
    <p>左：16 / 24 / 32 / 64 px。右：16px 的 8 倍邻近放大。下面三枚是 16px 专用简化候选。</p>
    <div class="row">
      <figure>
        <div class="slot" style="width: 24px; height: 24px">
          <img
            class="icon"
            src="../../../../assets/brand/foscen-icon.svg"
            width="16"
            height="16"
            alt=""
          />
        </div>
        <figcaption>16px</figcaption>
      </figure>
      <figure>
        <div class="slot" style="width: 32px; height: 32px">
          <img src="../../../../assets/brand/foscen-icon.svg" width="24" height="24" alt="" />
        </div>
        <figcaption>24px</figcaption>
      </figure>
      <figure>
        <div class="slot" style="width: 40px; height: 40px">
          <img src="../../../../assets/brand/foscen-icon.svg" width="32" height="32" alt="" />
        </div>
        <figcaption>32px</figcaption>
      </figure>
      <figure>
        <div class="slot" style="width: 72px; height: 72px">
          <img src="../../../../assets/brand/foscen-icon.svg" width="64" height="64" alt="" />
        </div>
        <figcaption>64px</figcaption>
      </figure>
      <figure>
        <img class="zoom" src="icon-16.png" width="128" height="128" alt="16px 8x" />
        <figcaption>16px qlmanage 栅格 ×8</figcaption>
      </figure>
    </div>
    <h1>16px 专用候选（SVG 按 16×16 实绘，右侧 CSS scale(8)）</h1>
    <div class="row" id="candidates">
      <figure>
        <div class="pair">
          <div class="slot">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
              <rect width="16" height="16" rx="4" fill="#123426" />
              <path
                d="M3.5 6.2V4.2A.7.7 0 0 1 4.2 3.5h2M9.8 3.5h2a.7.7 0 0 1 .7.7v2M12.5 9.8v2a.7.7 0 0 1-.7.7h-2M6.2 12.5h-2a.7.7 0 0 1-.7-.7v-2"
                fill="none"
                stroke="#72DBA5"
                stroke-width="1.5"
                stroke-linecap="round"
              />
              <rect x="5.5" y="5.5" width="5" height="5" rx="1.2" fill="#A6E8C4" />
            </svg>
          </div>
          <div class="slot big">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 16 16"
              width="16"
              height="16"
              style="transform: scale(8); transform-origin: top left"
            >
              <rect width="16" height="16" rx="4" fill="#123426" />
              <path
                d="M3.5 6.2V4.2A.7.7 0 0 1 4.2 3.5h2M9.8 3.5h2a.7.7 0 0 1 .7.7v2M12.5 9.8v2a.7.7 0 0 1-.7.7h-2M6.2 12.5h-2a.7.7 0 0 1-.7-.7v-2"
                fill="none"
                stroke="#72DBA5"
                stroke-width="1.5"
                stroke-linecap="round"
              />
              <rect x="5.5" y="5.5" width="5" height="5" rx="1.2" fill="#A6E8C4" />
            </svg>
          </div>
        </div>
        <figcaption>四角 + 方，无 F（推荐 16px 变体）</figcaption>
      </figure>
      <figure>
        <div class="pair">
          <div class="slot">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
              <rect width="16" height="16" rx="4" fill="#123426" />
              <rect x="3" y="3" width="10" height="10" rx="2.5" fill="#A6E8C4" />
              <path d="M6 12V4.5h5v1.6H7.6v1.5H10.6v1.5H7.6V12z" fill="#123426" />
            </svg>
          </div>
          <div class="slot big">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 16 16"
              width="16"
              height="16"
              style="transform: scale(8); transform-origin: top left"
            >
              <rect width="16" height="16" rx="4" fill="#123426" />
              <rect x="3" y="3" width="10" height="10" rx="2.5" fill="#A6E8C4" />
              <path d="M6 12V4.5h5v1.6H7.6v1.5H10.6v1.5H7.6V12z" fill="#123426" />
            </svg>
          </div>
        </div>
        <figcaption>只留 F 方块</figcaption>
      </figure>
      <figure>
        <div class="pair">
          <div class="slot">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
              <rect width="16" height="16" rx="4" fill="#123426" />
              <path
                d="M3.5 6.5V4A.5.5 0 0 1 4 3.5h2.5M9.5 3.5H12a.5.5 0 0 1 .5.5v2.5M12.5 9.5V12a.5.5 0 0 1-.5.5H9.5M6.5 12.5H4A.5.5 0 0 1 3.5 12V9.5"
                fill="none"
                stroke="#72DBA5"
                stroke-width="1.75"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <div class="slot big">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 16 16"
              width="16"
              height="16"
              style="transform: scale(8); transform-origin: top left"
            >
              <rect width="16" height="16" rx="4" fill="#123426" />
              <path
                d="M3.5 6.5V4A.5.5 0 0 1 4 3.5h2.5M9.5 3.5H12a.5.5 0 0 1 .5.5v2.5M12.5 9.5V12a.5.5 0 0 1-.5.5H9.5M6.5 12.5H4A.5.5 0 0 1 3.5 12V9.5"
                fill="none"
                stroke="#72DBA5"
                stroke-width="1.75"
                stroke-linecap="round"
              />
            </svg>
          </div>
        </div>
        <figcaption>只留四角</figcaption>
      </figure>
    </div>
  </body>
</html>
