<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foscen 控制面</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="omnibar" data-omnibar-root role="dialog" aria-modal="true" aria-label="打开场景">
      <div class="drag-strip" aria-hidden="true"></div>
      <div class="input-row">
        <div class="nav" data-omnibar-nav>
          <button
            class="icon-btn"
            type="button"
            data-back
            data-hide-narrow
            aria-label="后退"
          ></button>
          <button
            class="icon-btn"
            type="button"
            data-forward
            data-hide-narrow
            aria-label="前进"
          ></button>
          <button class="icon-btn" type="button" data-reload aria-label="刷新"></button>
        </div>
        <label class="field" data-field>
          <span class="visually-hidden" id="omnibar-label">HTTPS 地址或场景</span>
          <input
            id="omnibar-input"
            data-omnibar-input
            type="text"
            role="combobox"
            aria-labelledby="omnibar-label"
            aria-autocomplete="list"
            aria-haspopup="listbox"
            aria-expanded="true"
            aria-controls="omnibar-list"
            aria-activedescendant=""
            inputmode="url"
            autocomplete="off"
            spellcheck="false"
            placeholder="输入 HTTPS 地址或搜索场景"
          />
        </label>
        <button class="icon-btn" type="button" data-dismiss aria-label="关闭"></button>
      </div>
      <div class="live" data-omnibar-live role="status" aria-live="polite"></div>
      <div id="omnibar-list" class="list" role="listbox" aria-label="建议"></div>
      <p class="empty" data-omnibar-empty hidden></p>
      <div class="foot" data-omnibar-foot></div>
    </div>

    <div
      class="surface"
      data-surface-root
      role="dialog"
      aria-modal="true"
      aria-label="Foscen 控制面"
      hidden
    >
      <header class="surface-header">
        <h1 class="surface-title" data-surface-title>场景</h1>
        <p class="surface-status" data-status role="status" aria-live="polite"></p>
        <button class="icon-btn" type="button" data-surface-dismiss aria-label="关闭"></button>
      </header>
      <nav class="tabs" role="tablist" aria-label="工作面分类">
        <button
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="panel-scenes"
          tabindex="0"
          data-panel-target="scenes"
        >
          场景 <span class="count" data-scene-count>0</span>
        </button>
        <button
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="panel-downloads"
          tabindex="-1"
          data-panel-target="downloads"
        >
          下载 <span class="count" data-download-count>0</span>
        </button>
        <button
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="panel-permissions"
          tabindex="-1"
          data-panel-target="permissions"
        >
          权限 <span class="count" data-permission-count hidden>0</span>
        </button>
        <button
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="panel-update"
          tabindex="-1"
          data-panel-target="update"
        >
          升级
        </button>
      </nav>
      <div class="surface-body">
        <section
          id="panel-scenes"
          class="panel-section"
          role="tabpanel"
          tabindex="-1"
          data-panel="scenes"
        >
          <form class="inline-form" data-scene-form>
            <label class="visually-hidden" for="scene-name">场景名称</label>
            <input
              id="scene-name"
              data-scene-name
              type="text"
              maxlength="120"
              autocomplete="off"
              placeholder="给当前网页起个名字"
            />
            <button class="primary-button" type="submit">保存当前场景</button>
          </form>
          <p class="field-error" data-scene-error hidden>请输入场景名称</p>
          <div class="item-list" data-scene-list aria-label="已保存场景"></div>
          <p class="empty-state" data-scene-empty>还没有保存场景。</p>
        </section>
        <section
          id="panel-downloads"
          class="panel-section"
          role="tabpanel"
          tabindex="-1"
          data-panel="downloads"
          hidden
        >
          <div class="item-list" data-download-list aria-label="下载项目"></div>
          <p class="empty-state" data-download-empty>当前没有下载。</p>
        </section>
        <section
          id="panel-permissions"
          class="panel-section"
          role="tabpanel"
          tabindex="-1"
          data-panel="permissions"
          hidden
        >
          <article class="permission-prompt" data-permission-prompt hidden>
            <p class="eyebrow">网页正在请求</p>
            <h2 data-permission-title>权限请求</h2>
            <p class="origin" data-permission-origin></p>
            <div class="approval-actions" aria-label="权限有效期">
              <button class="primary-button" type="button" data-permission-lifetime="once">
                允许一次
              </button>
              <button type="button" data-permission-lifetime="session">本次会话</button>
              <button type="button" data-permission-lifetime="persistent">始终允许</button>
              <button type="button" data-permission-reject>拒绝</button>
            </div>
          </article>
          <h2 class="list-heading">已记录权限</h2>
          <div class="item-list" data-permission-list aria-label="已记录权限"></div>
          <p class="empty-state" data-permission-empty>没有已记录的权限。</p>
        </section>
        <section
          id="panel-update"
          class="panel-section"
          role="tabpanel"
          tabindex="-1"
          data-panel="update"
          hidden
        >
          <article class="update-card">
            <div>
              <h2 data-update-title>正在读取版本</h2>
              <p class="muted" data-update-message></p>
              <p class="version" data-update-version></p>
            </div>
            <div class="update-actions">
              <button type="button" data-update-check>检查升级</button>
              <button class="primary-button" type="button" data-update-install hidden>
                重启并安装
              </button>
            </div>
          </article>
          <div class="about">
            <img src="./foscen-mark.svg" width="48" height="48" alt="" />
            <strong>Foscen</strong>
            <p>Focus + Scene</p>
            <p>MIT</p>
          </div>
        </section>
      </div>
      <footer class="foot surface-foot">
        <span>Esc 返回网页</span>
        <span>地址请用 ⌘L</span>
      </footer>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
